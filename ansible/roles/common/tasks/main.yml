---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - htop
      - unzip
      - net-tools
      - jq
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Enable UFW and allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    state: enabled
