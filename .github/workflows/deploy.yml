name: HomePulse Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write  

env:
  TF_VERSION: "1.15.8"
  AWS_REGION: "eu-west-1"

jobs:
  # ──────────────────────────────────────────────
  # 1. Terraform Plan
  # ──────────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-24.04
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Get Runner IP
        id: runner_ip
        run: echo "ip=$(curl -s ifconfig.me)/32" >> "$GITHUB_OUTPUT"

      - name: Terraform Plan
        id: plan
        run: |
          set -o pipefail
          terraform plan \
            -var-file="prod.tfvars" \
            -var="my_ip=${{ steps.runner_ip.outputs.ip }}" \
            -input=false \
            -detailed-exitcode \
            -out=tfplan \
            2>&1 | tee plan_output.txt
          PLAN_EXIT=$?
          echo "exitcode=${PLAN_EXIT}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload Plan Artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('plan_output.txt', 'utf8');
            // Tronca se troppo lungo per il commento GitHub
            const maxLen = 60000;
            const truncated = planOutput.length > maxLen
              ? planOutput.substring(0, maxLen) + '\n... (troncato)'
              : planOutput;

            const body = `### Terraform Plan 📋
            \`\`\`
            ${truncated}
            \`\`\`
            *Pusher: @${{ github.actor }}, Workflow: \`${{ github.workflow }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  # ──────────────────────────────────────────────
  # 2. Approvazione manuale (solo su push/dispatch)
  # ──────────────────────────────────────────────
  approve:
    name: Manual Approval
    needs: plan
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.plan.outputs.plan_exitcode == '2'
    runs-on: ubuntu-24.04
    environment: production  # ← Richiede approvazione nell'environment GitHub
    steps:
      - name: Approval granted
        run: echo "✅ Deploy approvato"

  # ──────────────────────────────────────────────
  # 3. Terraform Apply
  # ──────────────────────────────────────────────
  apply:
    name: Terraform Apply
    needs: [plan, approve]
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.plan.outputs.plan_exitcode == '2'
    runs-on: ubuntu-24.04
    outputs:
      ec2_ip: ${{ steps.outputs.outputs.ec2_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false  # Per catturare output puliti

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform Init
        run: terraform init -input=false

      - name: Get Runner IP
        id: runner_ip
        run: echo "ip=$(curl -s ifconfig.me)/32" >> "$GITHUB_OUTPUT"

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan -var="my_ip=${{ steps.runner_ip.outputs.ip }}" 

      - name: Capture Terraform Outputs
        id: outputs
        run: |
          echo "ec2_ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────
  # 4. Ansible Playbook
  # ──────────────────────────────────────────────
  configure:
    name: Ansible Configure
    needs: apply
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip
          pip3 install ansible --break-system-packages

      - name: Write SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/homepulse-key.pem
          chmod 600 ~/.ssh/homepulse-key.pem
          # Disabilita host key checking per CI
          echo "Host *" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Write Ansible Vault Password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault-pass.txt

      - name: Wait for EC2 SSH Ready
        run: |
          EC2_IP="${{ needs.apply.outputs.ec2_ip }}"
          echo "Waiting for SSH on ${EC2_IP}..."
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/homepulse-key.pem -o ConnectTimeout=5 ubuntu@${EC2_IP} 'echo ok' 2>/dev/null; then
              echo "SSH ready!"
              exit 0
            fi
            echo "Attempt $i/30 - waiting 10s..."
            sleep 10
          done
          echo "❌ SSH timeout"
          exit 1

      - name: Run Ansible Playbook
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
          ANSIBLE_PRIVATE_KEY_FILE: "~/.ssh/homepulse-key.pem"
        run: |
          ansible-playbook site.yml \
            -i inventories/hosts.ini \
            --vault-password-file /tmp/vault-pass.txt \
            -v

      - name: Cleanup Secrets
        if: always()
        run: |
          rm -f ~/.ssh/homepulse-key.pem /tmp/vault-pass.txt